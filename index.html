<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Christmas Tree · v17.6</title>
<style>
  :root{
    --gold:#f3c969;
    --warm:#ffb347;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#050b12;
    overflow:hidden;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","STSong",serif;
    color:#eaf2f6;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 100%);
  }
  .headline{
    position:fixed;left:0;right:0;top:clamp(18px,4.2vh,44px);
    text-align:center;pointer-events:none;
  }
  .headline h1{
    font-size:clamp(20px,4.6vw,40px);
    font-weight:500;
    letter-spacing:.34em;
    text-indent:.34em;
    color:#fdf5e2;
    text-shadow:0 0 22px rgba(243,201,105,.55),0 0 60px rgba(243,201,105,.25);
    white-space:nowrap;
    animation:breathe 5.2s ease-in-out infinite;
  }
  .headline .line{
    width:min(340px,62vw);height:1px;margin:14px auto 0;
    background:linear-gradient(90deg,transparent,rgba(243,201,105,.8),transparent);
  }
  .headline p{
    margin-top:10px;font-size:clamp(10px,2.4vw,13px);
    letter-spacing:.26em;text-indent:.26em;color:rgba(206,226,236,.62);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .hint{
    position:fixed;left:0;right:0;bottom:clamp(12px,2.4vh,20px);
    text-align:center;pointer-events:none;
    font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;
    font-size:11px;letter-spacing:.18em;line-height:1.6;
    color:rgba(214,232,240,.42);
    white-space:nowrap;
  }
  .hint b{color:rgba(243,201,105,.8);font-weight:400;}
  .hint .sep{color:rgba(214,232,240,.2);padding:0 5px;}
  .hint .wide-only{display:inline;}
  @media (max-width:620px){
    .hint{bottom:10px;font-size:9.5px;letter-spacing:.1em;color:rgba(214,232,240,.36);}
    .hint .wide-only{display:none;}
  }
  .cam-panel{
    position:fixed;right:16px;bottom:clamp(46px,7vh,66px);
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
    z-index:5;
  }
  .cam-btn{
    font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;
    font-size:11px;letter-spacing:.16em;
    color:rgba(243,208,138,.95);
    padding:9px 16px;border-radius:999px;cursor:pointer;
    background:rgba(8,18,24,.72);
    border:1px solid rgba(243,201,105,.32);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:border-color .25s,box-shadow .25s,color .25s;
  }
  .cam-btn:hover{border-color:rgba(243,201,105,.65);box-shadow:0 0 22px rgba(243,201,105,.18);color:#ffe7b4;}
  .cam-btn:disabled{opacity:.55;cursor:progress;}
  .cam-stage{
    position:relative;width:172px;height:129px;border-radius:12px;overflow:hidden;
    border:1px solid rgba(243,201,105,.26);background:#04121a;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  #cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.82;}
  #camOverlay{position:absolute;inset:0;width:100%;height:100%;}
  .cam-badge{
    position:absolute;left:8px;right:8px;bottom:5px;pointer-events:none;
    font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;
    font-size:9.5px;letter-spacing:.08em;color:rgba(230,240,245,.72);
    text-shadow:0 1px 6px rgba(0,0,0,.9);
  }
  @media (max-width:620px){
    .cam-panel{right:10px;bottom:34px;gap:8px;}
    .cam-stage{width:132px;height:99px;}
    .cam-btn{font-size:10px;padding:7px 13px;letter-spacing:.1em;}
  }
  @keyframes breathe{
    0%,100%{opacity:.86;text-shadow:0 0 18px rgba(243,201,105,.42),0 0 50px rgba(243,201,105,.18);}
    50%{opacity:1;text-shadow:0 0 28px rgba(243,201,105,.7),0 0 78px rgba(243,201,105,.32);}
  }
  @media (prefers-reduced-motion:reduce){
    .headline h1{animation:none;}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<div class="headline">
  <h1>Merry Christmas</h1>
  <div class="line"></div>
  <p>christmas-tree &nbsp;·&nbsp; v17.6</p>
</div>

<div class="hint">
  拖动 <b>起风</b><span class="wide-only"><span class="sep">·</span>横向挥动 <b>旋转</b></span><span class="sep">·</span>双指 <b>缩放</b><span class="sep">·</span>点树顶 <b>星星</b>
</div>

<div class="cam-panel">
  <button class="cam-btn" id="camBtn" type="button">启用手势</button>
  <div class="cam-stage" id="camStage" hidden>
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="camOverlay"></canvas>
    <span class="cam-badge" id="camBadge">初始化…</span>
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d", { alpha: false });

  var W = 0, H = 0, DPR = 1, cx = 0, cy = 0, focal = 900;
  var tree = { h: 600, r: 180 };

  var angle = 0;
  var tilt = 0, tiltTarget = 0, spinBoost = 0;
  var zoom = 1, zoomTarget = 1;
  var time = 0;

  var pointer = { x: 0, y: 0, tx: 0, ty: 0, down: false, sx: 0, sy: 0, speed: 0, lastMove: -99 };
  var wind = { x: 0, y: 0, vx: 0, vy: 0, power: 0, pull: 0, radius: 200 };
  var WO = { x: 0, y: 0 };            // 复用的位移缓冲
  var lastMv = { x: 0, y: 0, t: 0 };
  var tap = { startX: 0, startY: 0, startT: 0, ok: false };
  var pointers = {};
  var pinch = false, pinchD0 = 1, pinchZ0 = 1;
  var handState = null;               // 摄像头手势输入
  var handPrev = false;

  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };

  /* ---------------- geometry ---------------- */

  var body = [];      // 树体针叶粒子
  var garlands = [];  // 螺旋灯串
  var baubles = [];   // 挂饰球
  var snow = [];
  var bgStars = [];
  var sparks = [];    // 点击迸发的星屑

  function buildGeometry() {
    body.length = 0; garlands.length = 0; baubles.length = 0;

    var N = 1600;
    for (var i = 0; i < N; i++) {
      var t = Math.pow(Math.random(), 0.66);           // 0 底 → 1 顶，底部更密
      var onSurface = Math.random() < 0.72;
      var rf = onSurface ? rand(0.9, 1.0) : Math.sqrt(Math.random()) * 0.9;
      body.push({
        t: t,
        th: rand(0, Math.PI * 2),
        rf: rf,
        hue: rand(132, 168),
        sat: rand(38, 66),
        size: rand(1.1, 2.8) * (1 - t * 0.22),
        ph: rand(0, Math.PI * 2),
        sp: rand(1.2, 3.4)
      });
    }

    // 三条螺旋灯串
    var strands = 3, perStrand = 46;
    for (var s = 0; s < strands; s++) {
      var offset = s * (Math.PI * 2 / strands);
      for (var j = 0; j < perStrand; j++) {
        var tt = j / perStrand;
        garlands.push({
          t: tt * 0.96 + 0.02,
          th: offset + tt * Math.PI * 2 * 2.6,
          ph: rand(0, Math.PI * 2),
          hot: 2.6 + Math.random() * 2.2,
          size: rand(2.2, 3.6)
        });
      }
    }

    // 挂饰球
    var ballColors = ["#ff5a5a", "#ffc861", "#ff8fb1", "#8fd6ff", "#b6f5a7", "#ffffff"];
    for (var b = 0; b < 34; b++) {
      var bt = rand(0.05, 0.93);
      baubles.push({
        t: bt,
        th: rand(0, Math.PI * 2),
        color: ballColors[Math.floor(Math.random() * ballColors.length)],
        size: rand(3.2, 6.4) * (1.15 - bt * 0.35),
        ph: rand(0, Math.PI * 2)
      });
    }
  }

  function buildSnow() {
    snow.length = 0;
    var n = Math.round(Math.min(360, (W * H) / 2700));
    for (var i = 0; i < n; i++) {
      snow.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: rand(0.25, 1),
        r: rand(0.7, 3.0),
        vy: rand(16, 54),
        sway: rand(0.4, 1.6),
        ph: rand(0, Math.PI * 2),
        a: rand(0.5, 1),
        wx: 0, wy: 0,           // 手势带来的额外速度
        jx: 0, jy: 0            // 累积位移
      });
    }
  }

  function buildBackgroundStars() {
    bgStars.length = 0;
    for (var i = 0; i < 120; i++) {
      bgStars.push({
        x: Math.random(), y: Math.random(),
        r: rand(0.4, 1.5),
        ph: rand(0, Math.PI * 2),
        sp: rand(0.8, 2.6)
      });
    }
  }

  /* ---------------- sprites ---------------- */

  function glowSprite(color, size) {
    var c = document.createElement("canvas");
    c.width = c.height = size;
    var g = c.getContext("2d");
    var rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    rg.addColorStop(0, "rgba(255,255,255,1)");
    rg.addColorStop(0.14, color);
    rg.addColorStop(0.42, "rgba(" + hexToRgb(color) + ",0.28)");
    rg.addColorStop(1, "rgba(" + hexToRgb(color) + ",0)");
    g.fillStyle = rg;
    g.beginPath();
    g.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
    g.fill();
    return c;
  }

  function hexToRgb(h) {
    h = h.replace("#", "");
    return parseInt(h.substr(0, 2), 16) + "," + parseInt(h.substr(2, 2), 16) + "," + parseInt(h.substr(4, 2), 16);
  }

  var SPRITE = {
    gold: glowSprite("#ffd27a", 96),
    amber: glowSprite("#ffb04a", 96),
    red: glowSprite("#ff5f5f", 96),
    cool: glowSprite("#9fe8ff", 96),
    white: glowSprite("#ffffff", 96)
  };

  /* ---------------- canvas sizing ---------------- */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var wide = (W / H) > 1.15;

    cx = W / 2;
    cy = H * (wide ? 0.605 : (W < 620 ? 0.578 : 0.545));

    tree.h = Math.min(H * (wide ? 0.66 : 0.72), 780);
    tree.r = tree.h * (wide ? 0.365 : 0.335);
    focal = tree.h * 2.15;

    wind.radius = Math.min(W, H) * 0.30;

    buildSnow();
  }

  /* ---------------- projection ---------------- */

  var P = { x: 0, y: 0, s: 0, z: 0 };

  function project(x, y, z) {
    var s = focal / (focal + z);
    P.x = cx + x * s;
    P.y = cy + y * s;
    P.s = s;
    P.z = z;
    return P;
  }

  /* ---------------- 手势风场 ---------------- */

  function windFall(x, y) {
    if (wind.power < 0.02) return 0;
    var dx = x - wind.x, dy = y - wind.y;
    var d2 = dx * dx + dy * dy, R = wind.radius;
    if (d2 > R * R) return 0;
    var f = 1 - Math.sqrt(d2) / R;
    return f * f * wind.power;
  }

  function windOffset(x, y, out) {
    var f = windFall(x, y);
    if (f <= 0) { out.x = 0; out.y = 0; return out; }
    var dx = x - wind.x, dy = y - wind.y;
    var d = Math.sqrt(dx * dx + dy * dy) + 0.001;
    var nx = dx / d, ny = dy / d;
    var dir = 1 - 2 * wind.pull;     // pull=1 时径向与涡旋同时反向 → 向内吸附
    // 径向推开/吸拢 + 切向涡旋 + 顺手势方向拖拽
    out.x = (nx * 58 * dir - ny * 42 * dir) * f + clamp(wind.vx * f * 0.14, -62, 62);
    out.y = (ny * 58 * dir + nx * 42 * dir) * f + clamp(wind.vy * f * 0.14, -62, 62);
    return out;
  }

  function updateWind(dt) {
    var moving = (time - pointer.lastMove) < 0.16 && Math.sqrt(wind.vx * wind.vx + wind.vy * wind.vy) > 30;
    var handLive = !!(handState && handState.present);
    var target = 0;
    if (handLive) target = Math.min(1, 0.52 + pointer.speed / 700 + (wind.pull > 0.2 ? 0.18 : 0));
    else if (pointer.down && moving && !pinch) target = Math.min(1, 0.18 + pointer.speed / 620);
    wind.power += (target - wind.power) * Math.min(1, dt * (target > wind.power ? 10 : 5));

    // 风场中心平滑跟随指针 / 手心
    var lerp = Math.min(1, dt * 18);
    wind.x += (pointer.sx - wind.x) * lerp;
    wind.y += (pointer.sy - wind.y) * lerp;

    if (!moving && !handLive) {
      var dec = Math.pow(0.24, dt);   // 抬手后风速自然衰减
      wind.vx *= dec; wind.vy *= dec;
    }
    if (!handLive) wind.pull *= Math.pow(0.2, dt);
  }

  /* ---------------- drawing: background ---------------- */

  var bgGrad = null, bgW = 0, bgH = 0;

  function drawBackground() {
    if (!bgGrad || bgW !== W || bgH !== H) {
      bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, "#050a11");
      bgGrad.addColorStop(0.45, "#07161d");
      bgGrad.addColorStop(0.78, "#04120f");
      bgGrad.addColorStop(1, "#02080b");
      bgW = W; bgH = H;
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // 树后的暖光晕
    var gx = cx, gy = cy + tree.h * 0.08;
    var rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, tree.h * 0.95);
    rg.addColorStop(0, "rgba(255,196,110,0.13)");
    rg.addColorStop(0.35, "rgba(120,180,150,0.06)");
    rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    // 背景微星
    for (var i = 0; i < bgStars.length; i++) {
      var st = bgStars[i];
      var tw = 0.35 + 0.65 * Math.abs(Math.sin(time * st.sp + st.ph));
      ctx.globalAlpha = tw * 0.55;
      ctx.fillStyle = "#cfe3f0";
      ctx.beginPath();
      ctx.arc(st.x * W, st.y * H, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------- drawing: tree ---------------- */

  var sorted = [];

  function drawTree() {
    var h = tree.h, r = tree.r;
    var cosA = Math.cos(angle), sinA = Math.sin(angle);
    var cosT = Math.cos(tilt), sinT = Math.sin(tilt);

    sorted.length = 0;

    // 针叶
    for (var i = 0; i < body.length; i++) {
      var p = body[i];
      var rad = r * (1 - p.t) * p.rf;
      var x0 = Math.cos(p.th) * rad;
      var z0 = Math.sin(p.th) * rad;
      var x1 = x0 * cosA - z0 * sinA;
      var z1 = x0 * sinA + z0 * cosA;
      var y0 = (0.5 - p.t) * h;
      // 轻微俯视倾斜
      var y1 = y0 * cosT - z1 * sinT;
      var z2 = y0 * sinT + z1 * cosT;
      project(x1, y1, z2);
      sorted.push({
        kind: 0, p: p, sx: P.x, sy: P.y, s: P.s, z: P.z
      });
    }

    // 灯串
    for (var g = 0; g < garlands.length; g++) {
      var q = garlands[g];
      var rr = r * (1 - q.t) * 1.02;
      var qx = Math.cos(q.th) * rr, qz = Math.sin(q.th) * rr;
      var qx1 = qx * cosA - qz * sinA;
      var qz1 = qx * sinA + qz * cosA;
      var qy0 = (0.5 - q.t) * h;
      var qy1 = qy0 * cosT - qz1 * sinT;
      var qz2 = qy0 * sinT + qz1 * cosT;
      project(qx1, qy1, qz2);
      sorted.push({ kind: 1, q: q, sx: P.x, sy: P.y, s: P.s, z: P.z });
    }

    // 挂饰
    for (var b = 0; b < baubles.length; b++) {
      var o = baubles[b];
      var orr = r * (1 - o.t) * 1.03;
      var ox = Math.cos(o.th) * orr, oz = Math.sin(o.th) * orr;
      var ox1 = ox * cosA - oz * sinA;
      var oz1 = ox * sinA + oz * cosA;
      var oy0 = (0.5 - o.t) * h + 6;
      var oy1 = oy0 * cosT - oz1 * sinT;
      var oz2 = oy0 * sinT + oz1 * cosT;
      project(ox1, oy1, oz2);
      sorted.push({ kind: 2, o: o, sx: P.x, sy: P.y, s: P.s, z: P.z });
    }

    sorted.sort(function (a, b) { return b.z - a.z; });

    // 地面反光（在树之前铺）
    var gy = cy + h * 0.5 * Math.cos(tilt) * 1.02;
    var gr = r * 2.0;
    ctx.save();
    ctx.translate(cx, gy);
    ctx.scale(1, 0.32);
    var eg = ctx.createRadialGradient(0, 0, 0, 0, 0, gr);
    eg.addColorStop(0, "rgba(255,196,112,0.20)");
    eg.addColorStop(0.22, "rgba(255,180,100,0.13)");
    eg.addColorStop(0.5, "rgba(110,195,155,0.07)");
    eg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(0, 0, gr, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.globalCompositeOperation = "lighter";

    for (var k = 0; k < sorted.length; k++) {
      var it = sorted[k];
      var fall = windFall(it.sx, it.sy);
      windOffset(it.sx, it.sy, WO);
      var ddx = it.sx + WO.x, ddy = it.sy + WO.y;

      if (it.kind === 0) {
        var pp = it.p;
        var depth = 0.55 + 0.45 * (1 - (it.z + r) / (2 * r + h * 0.1));
        depth = Math.max(0.35, Math.min(1.0, depth));
        var flick = 0.82 + 0.18 * Math.sin(time * pp.sp + pp.ph);
        var l = (23 + pp.t * 28 + fall * 16) * flick;
        ctx.fillStyle = "hsla(" + pp.hue + "," + pp.sat + "%," + l + "%,0.86)";
        var sz = Math.max(0.5, pp.size * it.s * 1.25);
        ctx.beginPath();
        ctx.arc(ddx, ddy, sz * depth, 0, Math.PI * 2);
        ctx.fill();
      } else if (it.kind === 1) {
        var qq = it.q;
        var pulse = Math.pow(0.5 + 0.5 * Math.sin(time * qq.hot + qq.ph), 3);
        var warm = (Math.sin(qq.ph * 3) > 0.2) ? SPRITE.gold : SPRITE.amber;
        if (Math.sin(qq.ph * 7) > 0.55) warm = SPRITE.cool;
        var size = qq.size * it.s * (5.6 + pulse * 3.2 + fall * 2.6);
        ctx.globalAlpha = Math.min(1, 0.35 + pulse * 0.6 + fall * 0.3);
        ctx.drawImage(warm, ddx - size / 2, ddy - size / 2, size, size);
      } else {
        var oo = it.o;
        var twk = 0.65 + 0.35 * Math.sin(time * 2.2 + oo.ph);
        var bs = oo.size * it.s * 2.6;
        ctx.globalAlpha = 0.9;
        var sp = oo.color === "#ffc861" ? SPRITE.gold : (oo.color === "#ff5a5a" ? SPRITE.red : SPRITE.white);
        ctx.drawImage(sp, ddx - bs, ddy - bs, bs * 2, bs * 2);
        // 球体本体
        var bg2 = ctx.createRadialGradient(ddx - bs * 0.3, ddy - bs * 0.3, 0, ddx, ddy, bs * 0.75);
        bg2.addColorStop(0, "rgba(255,255,255,0.95)");
        bg2.addColorStop(0.4, oo.color);
        bg2.addColorStop(1, "rgba(0,0,0,0)");
        ctx.globalAlpha = 0.55 + 0.35 * twk;
        ctx.fillStyle = bg2;
        ctx.beginPath();
        ctx.arc(ddx, ddy, bs * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---------------- star ---------------- */

  var starPulse = 0;

  function drawStar() {
    var h = tree.h;
    var cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    var y0 = -0.5 * h - 14;
    var y1 = y0 * cosT;
    project(0, y1, 0);
    var sx = P.x, sy = P.y, s = P.s;

    starPulse = 0.5 + 0.5 * Math.sin(time * 1.6);
    var near = windFall(sx, sy);
    starPulse = Math.min(1, starPulse + near * 1.2);

    var glowSize = (110 + starPulse * 46 + near * 40) * s;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.75;
    ctx.drawImage(SPRITE.gold, sx - glowSize / 2, sy - glowSize / 2, glowSize, glowSize);
    ctx.globalAlpha = 1;

    // 十字光刺
    var rays = 4;
    var len = (46 + starPulse * 22 + near * 16) * s;
    ctx.save();
    ctx.translate(sx, sy);
    for (var i = 0; i < rays; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI / 2 + time * 0.12);
      var lg = ctx.createLinearGradient(0, 0, 0, -len);
      lg.addColorStop(0, "rgba(255,240,200,0.9)");
      lg.addColorStop(1, "rgba(255,200,110,0)");
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(-len * 0.055, 0);
      ctx.lineTo(0, -len);
      ctx.lineTo(len * 0.055, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 五角星
    var R = 13 * s;
    ctx.fillStyle = "rgba(255,246,214,0.98)";
    ctx.beginPath();
    for (var a = 0; a < 10; a++) {
      var ang = -Math.PI / 2 + a * Math.PI / 5;
      var rad = (a % 2 === 0) ? R : R * 0.42;
      var px = Math.cos(ang) * rad, py = Math.sin(ang) * rad * 1.05;
      if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.shadowColor = "rgba(255,200,110,0.95)";
    ctx.shadowBlur = 26 * s;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.globalCompositeOperation = "source-over";
    return { x: sx, y: sy, r: Math.max(44, 62 * s) };
  }

  /* ---------------- snow ---------------- */

  function drawSnow(dt) {
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];

      // 手势推动：靠近指针的雪花被卷入气流
      var fall = windFall(f.x, f.y);
      if (fall > 0) {
        var k = fall * Math.min(1, dt * 10);
        f.wx += (wind.vx * 0.75 - f.wx) * k;
        f.wy += (wind.vy * 0.75 - f.wy) * k;
        var nx = (f.x - wind.x) / wind.radius;
        var ny = (f.y - wind.y) / wind.radius;
        var dir = 1 - 2 * wind.pull;
        f.wx += nx * fall * 170 * dt * dir;
        f.wy += ny * fall * 170 * dt * dir;
      }
      f.wx -= f.wx * Math.min(1, dt * 2.0);
      f.wy -= f.wy * Math.min(1, dt * 2.0);

      f.y += f.vy * f.z * dt + f.wy * dt;
      f.x += f.wx * dt;
      f.ph += dt * f.sway;

      var dx = Math.sin(f.ph) * 14 * f.z + pointer.tx * 12 * f.z;
      var px = f.x + dx;

      if (f.y > H + 8) { f.y = -8; f.x = Math.random() * W; f.wx = 0; f.wy = 0; }
      if (f.x < -140) f.x += W + 280; else if (f.x > W + 140) f.x -= W + 280;
      if (px < -10) px += W + 20; else if (px > W + 10) px -= W + 20;

      ctx.globalAlpha = f.a * (0.5 + 0.5 * f.z);
      ctx.fillStyle = "#eef7ff";
      ctx.beginPath();
      ctx.arc(px, f.y, f.r * f.z, 0, Math.PI * 2);
      ctx.fill();

      if (f.r * f.z > 1.9) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.25 * f.z + fall * 0.2;
        var gsz = f.r * f.z * 9;
        ctx.drawImage(SPRITE.white, px - gsz / 2, f.y - gsz / 2, gsz, gsz);
        ctx.globalCompositeOperation = "source-over";
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------- sparks ---------------- */

  function drawSparks(dt) {
    for (var i = sparks.length - 1; i >= 0; i--) {
      var sp = sparks[i];
      sp.life -= dt * sp.fade;
      if (sp.life <= 0) { sparks.splice(i, 1); continue; }
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vy += 42 * dt;
      sp.vx *= 0.985;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = Math.max(0, sp.life) * 0.9;
      var sz = sp.size * (0.5 + sp.life);
      var sprite = sp.gold ? SPRITE.gold : SPRITE.white;
      ctx.drawImage(sprite, sp.x - sz, sp.y - sz, sz * 2, sz * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function burst(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = rand(40, 190);
      sparks.push({
        x: x, y: y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 20,
        size: rand(2.2, 6),
        life: rand(0.7, 1.5),
        fade: rand(0.55, 1.1),
        gold: Math.random() < 0.7
      });
    }
  }

  /* ---------------- 指针处的风场可视化 ---------------- */

  function drawGesture() {
    if (wind.power < 0.04) return;
    var pull = wind.pull;
    var R = wind.radius * (0.55 + 0.45 * wind.power) * (1 - 0.22 * pull);
    var a = wind.power;

    ctx.globalCompositeOperation = "lighter";
    var rg = ctx.createRadialGradient(wind.x, wind.y, 0, wind.x, wind.y, R);
    if (pull > 0.5) {
      rg.addColorStop(0, "rgba(175,235,255," + (0.16 * a).toFixed(3) + ")");
      rg.addColorStop(0.5, "rgba(130,200,235," + (0.08 * a).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(130,200,235,0)");
    } else {
      rg.addColorStop(0, "rgba(255,214,150," + (0.15 * a).toFixed(3) + ")");
      rg.addColorStop(0.5, "rgba(185,235,220," + (0.07 * a).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(185,235,220,0)");
    }
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(wind.x, wind.y, R, 0, Math.PI * 2);
    ctx.fill();

    // 气流弧线：吸拢时反向旋转
    ctx.strokeStyle = pull > 0.5
      ? "rgba(170,230,255," + (0.28 * a).toFixed(3) + ")"
      : "rgba(255,226,170," + (0.26 * a).toFixed(3) + ")";
    ctx.lineWidth = 1.2;
    var base = time * 2.4 * (1 - 2 * pull);
    for (var i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(wind.x, wind.y, R * 0.62, base + i * 2.1, base + i * 2.1 + 0.85);
      ctx.stroke();
    }

    // 绕行光点
    var sprite = pull > 0.5 ? SPRITE.cool : SPRITE.gold;
    for (var j = 0; j < 7; j++) {
      var ang = time * 1.5 * (1 - 2 * pull) + j * Math.PI * 2 / 7;
      var rr = R * 0.5 * (0.72 + 0.28 * Math.sin(time * 3 + j));
      var gsz = 13 * (0.55 + 0.45 * a);
      ctx.globalAlpha = 0.45 * a;
      ctx.drawImage(sprite, wind.x + Math.cos(ang) * rr - gsz / 2, wind.y + Math.sin(ang) * rr - gsz / 2, gsz, gsz);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---------------- 摄像头手势 → 风场 ---------------- */

  window.XmasTree = {
    hand: null,
    modelReady: false,
    setHand: function (st) {
      if (st && st.present) {
        window.XmasTree.hand = {
          present: true, x: st.x, y: st.y,
          vx: st.vx || 0, vy: st.vy || 0,
          grab: st.grab || 0, open: st.open || 0, pinch: !!st.pinch
        };
      } else {
        window.XmasTree.hand = null;
      }
    }
  };

  function applyHand(dt) {
    var st = window.XmasTree.hand;
    if (!st || !st.present) {
      if (handPrev) { zoomTarget = 1; handPrev = false; pointer.down = false; }
      handState = null;
      return;
    }
    handPrev = true;
    handState = st;

    pointer.sx += (st.x - pointer.sx) * Math.min(1, dt * 14);
    pointer.sy += (st.y - pointer.sy) * Math.min(1, dt * 14);
    pointer.x = (pointer.sx / W - 0.5) * 2;
    pointer.y = (pointer.sy / H - 0.5) * 2;
    pointer.down = true;
    pointer.speed = Math.min(1500, Math.sqrt(st.vx * st.vx + st.vy * st.vy));
    pointer.lastMove = time;

    var k = Math.min(1, dt * 9);
    wind.vx += (clamp(st.vx, -1400, 1400) - wind.vx) * k;
    wind.vy += (clamp(st.vy, -1400, 1400) - wind.vy) * k;
    wind.pull += (st.grab - wind.pull) * Math.min(1, dt * 6);

    // 捏合时镜头微微推近
    zoomTarget = 1 + 0.18 * wind.pull;

    // 横向挥动加速旋转
    if (Math.abs(st.vx) > 300) spinBoost = Math.min(2.8, spinBoost + Math.abs(st.vx) * 0.0004);
  }

  /* ---------------- loop ---------------- */

  var last = 0;
  var starHit = { x: 0, y: 0, r: 60 };
  var autoSpin = 0.12;
  var elHead = document.querySelector(".headline");
  var elHint = document.querySelector(".hint");
  var uiFade = 1;

  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    time += dt;

    angle += (autoSpin + spinBoost) * dt;
    spinBoost *= 0.94;

    zoom += (zoomTarget - zoom) * Math.min(1, dt * 7);

    // 放大查看时，标题与提示自动隐去
    var fade = clamp(1 - (zoom - 1.02) / 0.30, 0, 1);
    if (Math.abs(fade - uiFade) > 0.004) {
      uiFade = fade;
      elHead.style.opacity = fade.toFixed(3);
      elHint.style.opacity = fade.toFixed(3);
    }

    tilt += (tiltTarget - tilt) * Math.min(1, dt * 6);

    pointer.tx += (pointer.x - pointer.tx) * Math.min(1, dt * 4);
    pointer.ty += (pointer.y - pointer.ty) * Math.min(1, dt * 4);
    tiltTarget = pointer.ty * 0.16 - clamp(wind.vy, -400, 400) * 0.00012;

    applyHand(dt);
    updateWind(dt);

    drawBackground();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(zoom, zoom);
    ctx.translate(-cx, -cy);
    drawTree();
    starHit = drawStar();
    ctx.restore();

    // 命中区域随缩放回到屏幕坐标
    starHit.x = cx + (starHit.x - cx) * zoom;
    starHit.y = cy + (starHit.y - cy) * zoom;
    starHit.r *= zoom;

    drawSnow(dt);
    drawSparks(dt);
    drawGesture();

    requestAnimationFrame(frame);
  }

  /* ---------------- interaction ---------------- */

  function countPointers() {
    var n = 0;
    for (var k in pointers) if (pointers.hasOwnProperty(k)) n++;
    return n;
  }

  function onDown(ev) {
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    var n = countPointers();

    if (n >= 2) {
      // 双指：进入缩放
      var ids = [];
      for (var k in pointers) if (pointers.hasOwnProperty(k)) ids.push(k);
      var a = pointers[ids[0]], b = pointers[ids[1]];
      pinch = true;
      pinchD0 = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
      pinchZ0 = zoomTarget;
      pointer.down = false;
      tap.ok = false;
      return;
    }
    if (n > 2) return;

    pointer.down = true;
    pointer.speed = 0;
    pointer.sx = ev.clientX;
    pointer.sy = ev.clientY;
    wind.x = ev.clientX;
    wind.y = ev.clientY;
    wind.vx = 0; wind.vy = 0;

    lastMv.x = ev.clientX;
    lastMv.y = ev.clientY;
    lastMv.t = ev.timeStamp || performance.now();

    tap.startX = ev.clientX;
    tap.startY = ev.clientY;
    tap.startT = performance.now();
    tap.ok = true;
  }

  function onMove(ev) {
    if (pointers[ev.pointerId]) {
      pointers[ev.pointerId].x = ev.clientX;
      pointers[ev.pointerId].y = ev.clientY;
    }
    var n = countPointers();

    if (pinch && n >= 2) {
      var ids = [];
      for (var k in pointers) if (pointers.hasOwnProperty(k)) ids.push(k);
      var a = pointers[ids[0]], b = pointers[ids[1]];
      var d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
      zoomTarget = clamp(pinchZ0 * (d / pinchD0), 0.6, 1.5);
      pointer.sx = (a.x + b.x) / 2;
      pointer.sy = (a.y + b.y) / 2;
      return;
    }
    if (n > 1) return;

    var now = ev.timeStamp || performance.now();
    var dts = Math.max(8, now - lastMv.t) / 1000;
    var vx = clamp((ev.clientX - lastMv.x) / dts, -1600, 1600);
    var vy = clamp((ev.clientY - lastMv.y) / dts, -1600, 1600);

    wind.vx = wind.vx * 0.55 + vx * 0.45;
    wind.vy = wind.vy * 0.55 + vy * 0.45;
    pointer.speed = Math.hypot(vx, vy);

    pointer.sx = ev.clientX;
    pointer.sy = ev.clientY;
    pointer.x = (ev.clientX / W - 0.5) * 2;
    pointer.y = (ev.clientY / H - 0.5) * 2;
    pointer.lastMove = time;

    // 横向甩动 → 树体跟着加速旋转
    if (Math.abs(vx) > 220) spinBoost = Math.min(2.8, spinBoost + Math.abs(vx) * 0.0006);

    // 快速拖动时洒出细小星屑
    if (pointer.speed > 420 && Math.random() < 0.22) {
      sparks.push({
        x: ev.clientX + rand(-8, 8), y: ev.clientY + rand(-8, 8),
        vx: vx * 0.16, vy: vy * 0.16,
        size: rand(1.8, 3.4),
        life: rand(0.35, 0.8),
        fade: rand(1.1, 1.8),
        gold: true
      });
    }

    if (Math.abs(ev.clientX - tap.startX) > 18 || Math.abs(ev.clientY - tap.startY) > 18) tap.ok = false;

    lastMv.x = ev.clientX;
    lastMv.y = ev.clientY;
    lastMv.t = now;
  }

  function onUp(ev) {
    delete pointers[ev.pointerId];
    if (countPointers() < 2) pinch = false;
    if (countPointers() > 0) return;

    pointer.down = false;
    pointer.lastMove = time;

    var held = performance.now() - tap.startT;
    if (tap.ok && held < 480) {
      var x = ev.clientX, y = ev.clientY;
      var dx = x - starHit.x, dy = y - starHit.y;
      if (dx * dx + dy * dy < starHit.r * starHit.r) {
        burst(starHit.x, starHit.y, 96);
        spinBoost = Math.min(3.6, spinBoost + 2.2);
        for (var i = 0; i < snow.length; i++) {
          snow[i].y = -rand(0, H * 0.55);
          snow[i].ph = rand(0, Math.PI * 2);
          snow[i].wx = 0; snow[i].wy = 0;
        }
      } else {
        burst(x, y, 46);
      }
    }
    tap.ok = false;
    // 抬手后保留残余风速，雪继续被气流带走
  }

  function onWheel(ev) {
    ev.preventDefault();
    zoomTarget = clamp(zoomTarget * Math.exp(-ev.deltaY * 0.0016), 0.6, 1.5);
  }

  document.addEventListener("pointerdown", onDown, { passive: true });
  document.addEventListener("pointermove", onMove, { passive: true });
  document.addEventListener("pointerup", onUp, { passive: true });
  document.addEventListener("pointercancel", onUp, { passive: true });
  document.addEventListener("pointerleave", function () {
    if (pointer.down) { pointer.down = false; }
    if (countPointers() === 0) { pointer.x = 0; pointer.y = 0; }
  }, { passive: true });
  document.addEventListener("wheel", onWheel, { passive: false });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  window.addEventListener("resize", function () { resize(); }, { passive: true });
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });

  /* ---------------- boot ---------------- */

  resize();
  buildGeometry();
  buildBackgroundStars();
  requestAnimationFrame(frame);
})();
</script>

<script type="module">
/* 摄像头手势（MediaPipe HandLandmarker）→ 驱动风场与粒子 */
const btn = document.getElementById("camBtn");
const stage = document.getElementById("camStage");
const video = document.getElementById("cam");
const overlay = document.getElementById("camOverlay");
const badge = document.getElementById("camBadge");
const octx = overlay.getContext("2d");
const tree = window.XmasTree;

const BONES = [
  [0, 1], [1, 2], [2, 3], [3, 4],
  [0, 5], [5, 6], [6, 7], [7, 8],
  [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16],
  [0, 17], [17, 18], [18, 19], [19, 20]
];

let landmarker = null, stream = null, running = false, rafId = 0;
let lastDetect = 0, lastHandAt = -1e9, lastFrameTs = 0;
let sx = 0, sy = 0, svx = 0, svy = 0, grab = 0;
let pinchLatch = false, fistLatch = false, handSeen = false, havePrev = false;
let baseW = 172, baseH = 129;

const say = (t) => { badge.textContent = t; };

async function loadModel() {
  if (landmarker) return landmarker;
  say("加载手势模型…");
  const mp = await import("./vendor/mp/vision_bundle.js");
  const fileset = await mp.FilesetResolver.forVisionTasks("./vendor/mp/wasm");
  const opts = {
    baseOptions: { modelAssetPath: "./vendor/mp/hand_landmarker.task", delegate: "GPU" },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  };
  try {
    landmarker = await mp.HandLandmarker.createFromOptions(fileset, opts);
  } catch (e) {
    opts.baseOptions.delegate = "CPU";          // 部分显卡/驱动不支持 GPU 委托
    landmarker = await mp.HandLandmarker.createFromOptions(fileset, opts);
  }
  tree.modelReady = true;
  return landmarker;
}

function syncOverlaySize() {
  const rect = stage.getBoundingClientRect();
  baseW = Math.round(rect.width) || 172;
  baseH = Math.round(rect.height) || 129;
  const dpr = window.devicePixelRatio || 1;
  overlay.width = Math.round(baseW * dpr);
  overlay.height = Math.round(baseH * dpr);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

async function start() {
  btn.disabled = true;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("当前浏览器不支持摄像头");
    }
    await loadModel();
    say("请求摄像头权限…");
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    stage.hidden = false;
    syncOverlaySize();
    running = true;
    handSeen = false; havePrev = false;
    lastDetect = 0; lastHandAt = -1e9;
    grab = 0; svx = svy = 0; pinchLatch = false; fistLatch = false;
    say("把手放进取景框");
    btn.textContent = "关闭手势";
    btn.disabled = false;
    rafId = requestAnimationFrame(loop);
  } catch (err) {
    btn.disabled = false;
    say("无法启用：" + (err && err.message ? err.message : String(err)));
  }
}

function stop() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  video.srcObject = null;
  stage.hidden = true;
  octx.clearRect(0, 0, baseW, baseH);
  tree.setHand(null);
  handSeen = false;
  havePrev = false;
  pinchLatch = false;
  fistLatch = false;
  btn.textContent = "启用手势";
}

function loop(ts) {
  if (!running) return;
  rafId = requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  if (ts - lastDetect < 32) return;            // 约 30fps 推理，留出渲染余量
  lastDetect = ts;
  let res;
  try { res = landmarker.detectForVideo(video, ts); } catch (e) { return; }
  const lms = res && res.landmarks && res.landmarks[0];
  drawOverlay(lms);
  if (!lms) {
    if (handSeen && ts - lastHandAt > 320) {
      handSeen = false;
      havePrev = false;
      tree.setHand(null);
      say("把手放进取景框");
    }
    return;
  }
  lastHandAt = ts;
  handSeen = true;
  feed(lms, ts);
}

function feed(lms, ts) {
  const W = window.innerWidth, H = window.innerHeight;
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const palm = Math.max(0.0001, d(lms[0], lms[9]));

  const pxU = (lms[0].x + lms[5].x + lms[9].x + lms[13].x + lms[17].x) / 5;
  const pyU = (lms[0].y + lms[5].y + lms[9].y + lms[13].y + lms[17].y) / 5;

  const pinchD = d(lms[4], lms[8]) / palm;           // 拇指尖—食指尖
  // 手指伸展度：指尖到自己指根的距离 / 掌长（伸直≈0.9，握拳≈0.35）
  const ext = (d(lms[8], lms[5]) + d(lms[12], lms[9]) + d(lms[16], lms[13]) + d(lms[20], lms[17])) / 4 / palm;

  if (pinchD < 0.36) pinchLatch = true;
  else if (pinchD > 0.56) pinchLatch = false;

  if (ext < 0.52) fistLatch = true;
  else if (ext > 0.66) fistLatch = false;

  let grabTarget = 0;
  if (pinchLatch) grabTarget = 1;
  else if (fistLatch) grabTarget = 0.55;             // 握拳 → 吸附聚拢
  grab += (grabTarget - grab) * 0.16;

  // 镜像到屏幕坐标（与自拍镜像视图一致）
  const tx = (1 - pxU) * W, ty = pyU * H;
  if (!havePrev) { sx = tx; sy = ty; svx = svy = 0; havePrev = true; }

  const dt = Math.max(0.016, (ts - (lastFrameTs || ts - 33)) / 1000);
  lastFrameTs = ts;
  const a = 0.30;
  const nx = sx + (tx - sx) * a;
  const ny = sy + (ty - sy) * a;
  const rvx = (nx - sx) / (dt * a);                  // 还原真实速度
  const rvy = (ny - sy) / (dt * a);
  svx += (rvx - svx) * 0.28;
  svy += (rvy - svy) * 0.28;
  sx = nx; sy = ny;

  tree.setHand({ present: true, x: sx, y: sy, vx: svx, vy: svy, grab: grab, open: ext, pinch: pinchLatch });

  say(fistLatch ? "握拳 · 聚拢粒子" : (pinchLatch ? "捏合 · 吸附聚拢" : "张开 · 推开粒子"));
}

function drawOverlay(lms) {
  octx.clearRect(0, 0, baseW, baseH);
  if (!lms) return;
  const p = lms.map((v) => ({ x: (1 - v.x) * baseW, y: v.y * baseH }));
  octx.strokeStyle = "rgba(243,201,105,0.5)";
  octx.lineWidth = 1;
  for (let i = 0; i < BONES.length; i++) {
    const a = BONES[i][0], b = BONES[i][1];
    octx.beginPath();
    octx.moveTo(p[a].x, p[a].y);
    octx.lineTo(p[b].x, p[b].y);
    octx.stroke();
  }
  octx.fillStyle = "rgba(255,236,196,0.92)";
  for (let i = 0; i < p.length; i++) {
    octx.beginPath();
    octx.arc(p[i].x, p[i].y, i === 0 ? 2.4 : 1.7, 0, Math.PI * 2);
    octx.fill();
  }
}

btn.addEventListener("click", () => { if (running) stop(); else start(); });
window.addEventListener("resize", () => { if (running) syncOverlaySize(); });
window.addEventListener("pagehide", () => { if (running) stop(); });
</script>
